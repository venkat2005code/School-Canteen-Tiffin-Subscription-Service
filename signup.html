<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | NourishKid</title>
  <meta name="description" content="Create a new account at NourishKid to manage your child's tiffin subscription.">

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <!-- Full-screen Auth Layout -->
  <div class="nk-auth-page" style="background: linear-gradient(rgba(11, 15, 25, 0.7), rgba(11, 15, 25, 0.85)), url('./src/assets/hero_home2.png');">
    
    <!-- Action Toggles -->
    <div class="nk-auth-toggles">
      <button aria-label="Toggle Direction Mode" class="topbar-icon-btn" onclick="if(window.app){window.app.toggleDir();}else{var html=document.documentElement; var next=html.getAttribute('dir')==='ltr'?'rtl':'ltr'; html.setAttribute('dir', next); localStorage.setItem('nk_dir', next); var txt = document.querySelectorAll('.rtl-status-text'); if(txt) txt.forEach(t=>t.textContent = next.toUpperCase());}" title="Toggle RTL/LTR" type="button">
        <span class="rtl-status-text" style="font-weight: 700; font-size: 0.85rem;">LTR</span>
      </button>
      <button aria-label="Toggle Light/Dark Theme" class="topbar-icon-btn" onclick="if(window.app){window.app.toggleTheme();}else{var html=document.documentElement; var next=html.getAttribute('data-theme')==='light'?'dark':'light'; html.setAttribute('data-theme', next); localStorage.setItem('nk_theme', next); var icon=document.getElementById('theme-icon'); if(icon){icon.className=next==='dark'?'fa-solid fa-sun':'fa-solid fa-moon';}}" title="Toggle Theme" type="button">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
      </button>
    </div>
    
    <!-- Glassmorphic Panel -->
    <div class="nk-auth-panel">
      
      <a href="index.html" class="nk-auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="brand-icon">
          <defs>
            <linearGradient id="nk-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#E05D38" />
              <stop offset="100%" stop-color="#F59E0B" />
            </linearGradient>
            <linearGradient id="nk-leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#34D399" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
          </defs>
          <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#nk-bg-grad)" />
          <rect x="18" y="18" width="64" height="64" rx="16" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.4" />
          <path d="M 18 50 L 82 50" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="3 3" />
          <path d="M 50 50 L 50 82" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.3" />
          <path d="M 38 32 C 38 27 42 27 42 22" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9" />
          <path d="M 50 34 C 50 29 54 29 54 24" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9" />
          <path d="M 62 32 C 62 27 66 27 66 22" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9" />
          <g transform="translate(24, 56) scale(0.65)" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 10 25 L 10 12 C 10 6 16 6 16 12 L 16 25 M 13 25 L 13 36" fill="#FFFFFF" />
            <path d="M 26 8 L 26 18 M 30 8 L 30 18 M 34 8 L 34 18 M 26 18 C 26 24 34 24 34 18 M 30 24 L 30 36" fill="#FFFFFF" />
          </g>
          <g transform="translate(62, 10)">
            <path d="M 12 2 C 26 2 30 16 30 30 C 16 30 2 26 2 12 C 2 6 6 2 12 2 Z" fill="url(#nk-leaf-grad)" stroke="#FFFFFF" stroke-width="2" />
            <path d="M 12 2 Q 16 16 30 30" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8" />
          </g>
        </svg>
        <span style="font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--text-main);">Nourish<span style="color: var(--primary);">Kid</span></span>
      </a>
      
      <div class="nk-auth-header">
        <h2>Join Our Community</h2>
        <p>Register today to build healthy habits for your kids.</p>
      </div>

      <form class="nk-auth-form" action="parent-dashboard.html" method="GET">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Jane Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="parent@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="nk-auth-options" style="justify-content: flex-start;">
          <label style="display: flex; align-items: center; cursor: pointer; font-weight: 400;">
            <input type="checkbox" style="accent-color: var(--primary); margin-right: 8px;" required> 
            <span>I agree to the <a href="#" style="color: var(--primary); font-weight: 600;">Terms of Service</a></span>
          </label>
        </div>

        <button type="submit" class="nk-auth-btn">Create Account</button>
      </form>

      <div class="social-login" style="text-align: center; margin-top: 2rem;">
        <p style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 1rem;">Or continue with</p>
        <div style="display: flex; justify-content: center; gap: 1rem;">
          <button type="button" class="btn btn-outline" style="flex: 1; padding: 0.75rem;"><i class="fa-brands fa-google" style="color: #ea4335;"></i></button>
          <button type="button" class="btn btn-outline" style="flex: 1; padding: 0.75rem;"><i class="fa-brands fa-apple" style="color: var(--text-main);"></i></button>
          <button type="button" class="btn btn-outline" style="flex: 1; padding: 0.75rem;"><i class="fa-brands fa-facebook-f" style="color: #1877f2;"></i></button>
        </div>
      </div>

      <div class="nk-auth-footer">
        <p>Already have an account? <a href="login.html">Log in here</a></p>
      </div>
    </div>
  </div>

  <script src="./src/main.js"></script>
</body>
</html>
